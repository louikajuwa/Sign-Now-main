services:
  app:
    build:
      context: ./laravel-app
      dockerfile: Dockerfile
    container_name: signnow-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./laravel-app:/var/www/html
      - docsign_files:/var/www/html/storage/app/private/docsign
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - signnow
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  queue:
    build:
      context: ./laravel-app
      dockerfile: Dockerfile
    container_name: signnow-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work redis --tries=3 --timeout=120
    volumes:
      - ./laravel-app:/var/www/html
      - docsign_files:/var/www/html/storage/app/private/docsign
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - signnow
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: signnow-nginx
    restart: unless-stopped
    ports:
      - "8027:80"
    volumes:
      - ./laravel-app:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - signnow
    depends_on:
      - app

  node:
    build:
      context: ./socket-server
      dockerfile: Dockerfile
    container_name: signnow-node
    restart: unless-stopped
    ports:
      - "3027:3027"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WS_PORT=3027
    networks:
      - signnow
    depends_on:
      redis:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: signnow-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:3327:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-signnow}
      MYSQL_USER: ${DB_USERNAME:-signnow}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - signnow
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: signnow-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6427:6379"
    volumes:
      - redis_data:/data
    networks:
      - signnow
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin
    container_name: signnow-phpmyadmin
    restart: unless-stopped
    ports:
      - "127.0.0.1:8127:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${DB_USERNAME:-signnow}
      PMA_PASSWORD: ${DB_PASSWORD:-secret}
    networks:
      - signnow
    depends_on:
      mysql:
        condition: service_healthy

  mailhog:
    image: mailhog/mailhog
    container_name: signnow-mailhog
    restart: unless-stopped
    ports:
      - "127.0.0.1:8227:8025"
      - "127.0.0.1:1027:1025"
    networks:
      - signnow

networks:
  signnow:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  docsign_files:
